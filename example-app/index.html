<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />


    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
<title>@capgo/capacitor-webview-version-checker Example</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="container">
      <h1>@capgo/capacitor-webview-version-checker</h1>
      <p class="lead">Check WebView freshness, listen to status events, and trigger native update prompts.</p>

      <div class="actions">
        <button id="check-status">Check status</button>
        <button id="start-monitoring">Start monitoring</button>
        <button id="show-prompt">Show update prompt</button>
      </div>

      <pre id="plugin-output">Press a button to run an action.</pre>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
